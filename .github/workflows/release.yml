name: Release

# Push a tag like v0.1.0 (matching Cargo.toml) to build binaries, publish a
# GitHub release and push ghcr.io/<owner>/loxinflux-migration-helper.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN: loxinflux-migration-helper

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml $v"; exit 1; }

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, arch: amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, arch: arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="$BIN-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p out "$name"
          cp README.md LICENSE "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/$BIN.exe" "$name/"
            7z a "out/$name.zip" "$name" >/dev/null
          else
            cp "target/${{ matrix.target }}/release/$BIN" "$name/"
            tar -czf "out/$name.tar.gz" "$name"
          fi
          if [ -n "${{ matrix.arch }}" ]; then
            mkdir -p "dist/${{ matrix.arch }}" && cp "target/${{ matrix.target }}/release/$BIN" "dist/${{ matrix.arch }}/"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.target }}
          path: out/*
      - if: matrix.arch != ''
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.arch }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: out
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && sha256sum * > SHA256SUMS && cd ..
          gh release create "${GITHUB_REF_NAME}" out/* --title "${GITHUB_REF_NAME}" --notes "See CHANGELOG.md."

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: chmod +x dist/*/$BIN
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$BIN" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:latest
