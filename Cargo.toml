[package]
name = "loxinflux-migration-helper"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Migrate an InfluxDB v2 bucket written by loxInFlux 0.3 to the float-only schema of loxInFlux 0.5"
repository = "https://github.com/Jakob-Gliwa/loxInFlux-migration-helper"
license = "MIT"
readme = "README.md"
keywords = ["influxdb", "loxone", "migration", "loxinflux"]
categories = ["command-line-utilities", "database"]

[dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
crossbeam-channel = "0.5"
ctrlc = { version = "3", features = ["termination"] }
csv = "1"
flate2 = "1"
itoa = "1"
memchr = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "gzip", "json", "query"] }
ryu = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[lints.clippy]
all = "warn"
